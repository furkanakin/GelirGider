name: evimiz
description: Evimiz — Aile gelir-gider yönetimi (AI destekli)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / routing / DI
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Charts
  fl_chart: ^0.69.2

  # Voice (offline, on-device speech-to-text)
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Camera + on-device OCR (mobile only — gracefully degraded on web)
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#C4593C"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#C4593C"
    theme_color: "#C4593C"

flutter_native_splash:
  color: "#FAF7F2"
  image: assets/icon.png
  color_dark: "#1A1A1A"
  image_dark: assets/icon.png
  android_12:
    color: "#FAF7F2"
    image: assets/icon.png
    color_dark: "#1A1A1A"
    image_dark: assets/icon.png
  web: false

flutter:
  uses-material-design: true
  # Geist fontları assets/fonts/ klasörüne eklendiğinde aşağıyı aç:
  # fonts:
  #   - family: Geist
  #     fonts:
  #       - asset: assets/fonts/Geist-Regular.ttf
  #       - asset: assets/fonts/Geist-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Geist-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Geist-Bold.ttf
  #         weight: 700
  #   - family: GeistMono
  #     fonts:
  #       - asset: assets/fonts/GeistMono-Regular.ttf
  #       - asset: assets/fonts/GeistMono-Medium.ttf
  #         weight: 500
