name: evimiz
description: Evimiz — Aile gelir-gider yönetimi (AI destekli)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / routing / DI
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Charts
  fl_chart: ^0.69.2

  # Voice — record raw audio and send to backend Whisper. Works on Android,
  # iOS, web (MediaRecorder), macOS, Windows, Linux. No platform speech engine
  # needed, so no Google Turkish language pack download prompt.
  record: ^5.2.0
  path_provider: ^2.1.5  # required by record on mobile to resolve a writable temp dir
  permission_handler: ^11.3.1

  # Camera (live preview) + image picker (gallery). OCR runs server-side now
  # via the vision LLM, so ML Kit is no longer required.
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# `record` 5.2.x ships an old `record_linux` (0.7.2) whose platform-channel
# signature doesn't match `record_platform_interface` 1.5.0 — kernel_snapshot
# fails even though we don't target Linux. Pin to a newer record_linux.
dependency_overrides:
  record_linux: ^1.3.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#C4593C"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#C4593C"
    theme_color: "#C4593C"

flutter_native_splash:
  color: "#FAF7F2"
  image: assets/icon.png
  color_dark: "#1A1A1A"
  image_dark: assets/icon.png
  android_12:
    color: "#FAF7F2"
    image: assets/icon.png
    color_dark: "#1A1A1A"
    image_dark: assets/icon.png
  web: false

flutter:
  uses-material-design: true
  # Geist fontları assets/fonts/ klasörüne eklendiğinde aşağıyı aç:
  # fonts:
  #   - family: Geist
  #     fonts:
  #       - asset: assets/fonts/Geist-Regular.ttf
