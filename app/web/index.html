<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Evimiz — Türkçe, AI destekli aile gelir-gider defteri.">
  <meta name="theme-color" content="#C4593C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Evimiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Evimiz — Aile gelir-gider</title>
  <style>
    html, body { background: #FAF7F2; margin: 0; padding: 0; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #FAF7F2; color: #1A1A1A; font-family: -apple-system, system-ui, sans-serif;
      flex-direction: column; gap: 12px;
    }
    #loading .dot {
      width: 56px; height: 56px; border-radius: 16px; background: #C4593C;
      display: flex; align-items: center; justify-content: center;
    }
    #loading .dot::before {
      content: ''; width: 28px; height: 28px;
      background: url('icons/Icon-192.png') center/contain no-repeat;
    }
    #loading .label { font-size: 14px; color: #7A6F65; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading"><div class="dot"></div><div class="label">Evimiz yükleniyor…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
