<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Evimiz — Türkçe, AI destekli aile gelir-gider defteri.">
  <meta name="theme-color" content="#C4593C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Evimiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Evimiz — Aile gelir-gider</title>
  <style>
    html, body { background: #FAF7F2; margin: 0; padding: 0; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #FAF7F2; color: #1A1A1A; font-family: -apple-system, system-ui, sans-serif;
      flex-direction: column; gap: 12px;
    }
    #loading .dot {
      width: 56px; height: 56px; border-radius: 16px; background: #C4593C;
      display: flex; align-items: center; justify-content: center;
    }
    #loading .dot::before {
      content: ''; width: 28px; height: 28px;
      background: url('icons/Icon-192.png') center/contain no-repeat;
    }
    #loading .label { font-size: 14px; color: #7A6F65; }

    /* iOS Safari PWA install hint — appears at the bottom for iPhone/iPad
       Safari users that haven't yet added the app to their home screen.
       Apple doesn't expose a beforeinstallprompt API, so this is the only
       way to nudge iOS users toward "Share → Add to Home Screen". */
    #ios-install {
      position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 9999;
      background: #1A1A1A; color: #fff; border-radius: 16px; padding: 14px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
      display: none; align-items: center; gap: 12px;
      font-family: -apple-system, system-ui, sans-serif;
      transform: translateY(120%); transition: transform 220ms ease;
    }
    #ios-install.visible { transform: translateY(0); display: flex; }
    #ios-install .icon {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: #C4593C url('icons/Icon-192.png') center/24px no-repeat;
    }
    #ios-install .body { flex: 1; line-height: 1.35; }
    #ios-install .title { font-weight: 700; font-size: 14px; }
    #ios-install .sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
    #ios-install .sub b { color: #E8B5A0; font-weight: 600; }
    #ios-install .close {
      background: none; border: 0; color: #fff; opacity: 0.6; font-size: 22px;
      cursor: pointer; padding: 0 4px; line-height: 1;
    }
    @media (min-width: 720px) { #ios-install { left: auto; right: 24px; bottom: 24px; max-width: 360px; } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading"><div class="dot"></div><div class="label">Evimiz yükleniyor…</div></div>
  <div id="ios-install" role="dialog" aria-label="Uygulamayı yükle">
    <div class="icon" aria-hidden="true"></div>
    <div class="body">
      <div class="title">Uygulamayı yükle</div>
      <div class="sub">Safari'de <b>Paylaş</b> → <b>Ana Ekrana Ekle</b> ile evimiz cebine düşsün.</div>
    </div>
    <button class="close" type="button" aria-label="Kapat" id="ios-install-close">×</button>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('loading')?.remove();
    });

    // iOS Safari PWA install banner.
    // Show only when:
    //   - User-agent looks like iPhone/iPod/iPad Safari (mobile or iPadOS)
    //   - We're NOT already running standalone (added to home screen)
    //   - User hasn't dismissed it permanently
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isIPad = /\bMacintosh\b/.test(ua) && 'ontouchend' in document; // iPadOS reports as Mac
        var isIos = /iPad|iPhone|iPod/.test(ua) || isIPad;
        var isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        var dismissed = localStorage.getItem('evimiz.iosInstallDismissed');
        if (!isIos || isStandalone || dismissed === '1') return;

        var el = document.getElementById('ios-install');
        // Surface a few seconds after first frame so it doesn't fight with the
        // loading splash / login mount.
        var show = function () {
          el.classList.add('visible');
        };
        if (document.readyState === 'complete') {
          setTimeout(show, 1500);
        } else {
          window.addEventListener('flutter-first-frame', function () { setTimeout(show, 1500); });
        }
        document.getElementById('ios-install-close').addEventListener('click', function () {
          el.classList.remove('visible');
          try { localStorage.setItem('evimiz.iosInstallDismissed', '1'); } catch (e) {}
        });
      } catch (e) {
        // Never let banner code break the app.
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
